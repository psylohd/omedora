[display]
show_time = false
# greeting = "Welcome to the system!"
# align_greeting = "center"
issue = false

[layout]
width = 60
window_padding = 2
container_padding = 1
prompt_padding = 1

[layout.widgets]
time_position = "top"
status_position = "bottom"

[remember]
username = true
session = false
user_session = true

[user_menu]
enabled = true
min_uid = 1000
max_uid = 60000

[secret]
mode = "characters"
characters = "*"

[keybindings]
command = 2
sessions = 3
background = 4
power = 12

[background]
# Starfield gives a sparse drifting field of stars behind the form. Default
# density (~60 stars) is tuned for an 80x24 grid so the login UI stays
# legible regardless of monitor size — accepts the cross-monitor asymmetry
# gracefully (no fog gradient that would look broken on a stretched VM
# framebuffer).
kind = "starfield"
fps = 30

[brand]
path = "/etc/tuigreet/brand.txt"
align = "center"

[background.starfield]
density      = 60
min_speed    = 0.10
max_speed    = 0.60
twinkle_rate = 0.05
# Brightness ramp from dimmest to brightest star. White-on-black reads cleanly
# against the pitch-black TTY (palette.sh's P0 = #000000), no colour mixing.
palette = ["#555566", "#9999aa", "#ccccdd", "#ffffff"]

[session]
sessions_dirs = ["/usr/share/wayland-sessions", "/usr/share/xsessions"]
xsessions_dirs = []
environments = []

[power]
use_setsid = false

[theme]
# foreground = text/icon color, .bg = background color
border = "white"
text = "green"
time = "blue"
container = "black"
title = "cyan"
greet = "yellow"
brand = "light-green"
prompt = "white"
action = "light-gray"
button = "gray"
