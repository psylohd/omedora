# nokron.toml — single source of truth for the Fedora post-install.
#
# fedora_install.sh reads this. Every section corresponds to a stage of the
# installer. Edit a list, re-run the script, get the same outcome.
#
# Conventions:
#   - All package names are dnf5 package names.
#   - COPR identifiers are Fedorahosted COPR short names: "owner/name".
#   - Vendored binaries are downloaded from a pinned GitHub release with a
#     per-binary sha256 manifest; this is how we avoid `curl|bash`.
#   - Paths under [paths] are relative to the repo root unless absolute.
#   - User `target_user` is the desktop user (NOT root). Most configs land
#     under $HOME.

# ── Identity ──────────────────────────────────────────────────────────────────
[meta]
name        = "nokron"
description = "Minimal Fedora + Hyprland + dms + curated apps"
target_user = ""                  # REQUIRED: set to the desktop user account.

# The install script runs as root and configures the system. No privileged
# operations are needed at runtime after install.sh completes — the target
# user's systemd session handles dms and other user services.
#
# To clean up after the install:  rm /etc/sudoers.d/99-nokron-<user>
[sudo]
passwordless = true   # drop a NOPASSWD sudoers file for target_user


# ── Repositories ──────────────────────────────────────────────────────────────
[coprs]
enable = [
  "avengemedia/danklinux",        # quickshell-git, matugen, cliphist, danksearch, dgop, ghostty
  "avengemedia/dms",              # dms (auto-enables danklinux as build dep)
  "lionheartp/Hyprland",          # the Hyprland stack on Fedora 43/44/45
  "leloubil/wl-clip-persist",     # Wayland clipboard persistence
  "tofik/nwg-shell",              # nwg-look + nwg-displays
  "scottames/ghostty",            # ghostty (not in Fedora's default repos)
]
# ── Packages ──────────────────────────────────────────────────────────────────
[packages.hyprland]
# All from lionheartp/Hyprland COPR (must be enabled first).
core = [
  "hyprland", "aquamarine", "hyprcursor", "hyprgraphics", "hyprutils",
  "hyprlang", "hyprland-qt-support",
  "hyprland-guiutils",
  "hyprpolkitagent", "xdg-desktop-portal-hyprland",
  # hyprland-protocols + hyprwayland-scanner dropped — both are src-only in
  # the COPR (no installable x86_64 binary). hyprwayland-scanner ships
  # inside the hyprland RPM at /usr/bin/hyprwayland-scanner; hyprland-
  # protocols isn't strictly needed for our config.
  "hyprpaper", "hyprlock", "hypridle", "hyprshot", "hyprpicker",
  "hyprsunset", "hyprsysteminfo", "hyprlauncher", "hyprshutdown",
]
[packages.quickshell]
# All from official Fedora. quickshell 0.2.1 ships in F44.
runtime = [
  "quickshell",
  "qt6-qtbase", "qt6-qtdeclarative", "qt6-qtsvg",
  "qt6-qtimageformats", "qt6-qtmultimedia",
  "qt6-qt5compat",                 # MultiEffect blur
  "qt6-qtwayland",                 # Qt Wayland backend
  "polkit",
]
# ── Build toolchain ──────────────────────────────────────────────────────────
# Required to build tuigreet from source at install time. Not strictly
# needed on the deployed system once tuigreet is built; can be removed
# later with `dnf remove rust cargo` if you want a leaner system.
[packages.build]
required = [
  "rust",                           # rustc + cargo, official Fedora (1.98.x in F44)
  "cargo",
]

# ── Vendored binaries (replaces curl|bash for projects that lag in COPRs) ─────

[packages.apps]
# Official Fedora unless marked.
required = [
  # Files / viewing
  "nautilus",                       # GNOME Files
  "gnome-disk-utility",             # GNOME Disks
  "loupe",                          # GNOME image viewer
  "gnome-text-editor",              # GNOME Text Editor
  # Wayland helpers
  "xwayland-satellite",             # rootless Xwayland
  # Login stack
  "greetd", "accountsservice", "polkit",
  # Audio
  "pipewire", "pipewire-pulseaudio", "wireplumber",
  "pavucontrol",
  # Power / night light / clipboard
  "power-profiles-daemon", "wlsunset",
  # Portals / XDG
  "xdg-desktop-portal-gtk", "xdg-user-dirs",
  # Shell + tools
  "fish", "fastfetch", "grim", "slurp",
  "ghostty", "qt6ct",
  "playerctl", "gnome-keyring",
  # Boot splash
  "plymouth", "plymouth-plugin-script",   # plugin-script is required by nokron theme
  "papirus-icon-theme" # Icon pack
]

optional_copr = [
  "wl-clip-persist",                # from leloubil/wl-clip-persist
  "gpu-screen-recorder",            # from lionheartp/Hyprland COPR
  "nwg-look", "nwg-displays",       # from tofik/nwg-shell
]


# ── DMS packages (from avengemedia/danklinux + avengemedia/dms COPRs) ──────────
# dms + its deps come from COPR. The danklinux COPR provides: quickshell-git,
# matugen, cliphist, danksearch, dgop. The dms COPR provides: dms.
# dms auto-installs quickshell-git from danklinux if not already present.
# Note: dankcalendar-git is in avengemedia/dms-git (unstable), not in
# the stable COPRs.
[packages.dms]
# dms: installed as a single package; weak deps (danksearch, matugen, cava,
# qt6ct, qt6-qtmultimedia) are installed by default. Pass
# --setopt=install_weak_deps=False to skip them.
install_weak_deps = true

[flatpak]
# Per-user browsers (Zen) live under `user` so they install into
# ~/.local/share/flatpak, are owned by the desktop user, and don't
# bleed into other accounts. Use `system` only for things every user
# on the box genuinely needs (codecs, fonts, system helpers).
system = []
user = [
  "app.zen_browser.zen",            # Zen Browser (not in any dnf repo)
]
# ── DMS plugins ───────────────────────────────────────────────────────────────
# Two sources, both installed by the dms stage:
#   [dms_plugins].plugins  — git URLs (cloned into
#                             ~/.config/DankMaterialShell/plugins/)
#   [dms_plugins].registry — plugin IDs from the dms registry
#     (https://github.com/AvengeMedia/dms-plugin-registry), installed via
#     `dms plugins install <id>`. These are quickshell UI plugins (e.g.
#     `dankQuickSearch`). Do NOT confuse with the standalone `danksearch`
#     binary — that is installed from avengemedia/danklinux COPR.
[dms_plugins]
plugins = [
  # "https://github.com/your-fork/wallpaperCarousel",
  # "https://github.com/your-fork/homeAssistantMonitor",
]
registry = [
  # "dankQuickSearch",   # quickshell UI launcher plugin (NOT the danksearch binary)
]
# ── Config trees ──────────────────────────────────────────────────────────────
# Drop each tree into target_user's $HOME with timestamped .bak on conflict.
[paths.repo]
plymouth   = "plymouth"           # → /usr/share/plymouth/themes/nokron
tuigreet   = "tuigreet"           # → /etc/tuigreet  + /usr/local/bin/tuigreet
tuigreet_src = ""                 # legacy: path to a pre-cloned Cargo workspace
hyprland   = "hyprland"           # → $HOME/.config/hypr
dms        = "DankMaterialShell"  # → $HOME/.config/DankMaterialShell
quickshell = "quickshell"         # → $HOME/.config/quickshell (dms wraps this)
vendored_tuigreet_repo_url = "https://github.com/psylohd/tuigreet.git"
vendored_tuigreet_branch   = "tweak"
vendored_tuigreet_commit   = ""
# ── Greeter
# backend = "tuigreet"     — current Rust build under [vendored.tuigreet]
# The exact command + user are hardcoded in lib/stage-greetd.sh so the
# installed greetd config matches what the Hyprland RPM expects to launch
# (i.e. /usr/bin/start-hyprland, which the RPM ships). If you ever want
# to point greetd at a custom launcher, edit stage-greetd.sh directly.
[greeter]
backend = "tuigreet"
# ── System services ───────────────────────────────────────────────────────────
# Stage services to systemctl enable after install. The greetd stage wires
# the config file; this section just turns on the systemd unit. plymouth-start
# brings up the bootsplash, greetd brings up the login.
[services]
enable = [
  "greetd.service",
  "plymouth-start.service",
]
set_default = "graphical.target"

# ── Stage toggles ─────────────────────────────────────────────────────────────
[stages]
copr      = true
dnf       = true
vendor    = true
flatpak   = true
plymouth  = true
tuigreet  = true
hyprland  = true
quickshell = true
greetd     = true
dms        = true
services   = true
